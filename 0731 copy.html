<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>boring proj</title>
  <link rel="stylesheet" href="https://use.typekit.net/cor3fci.css">
  <style>
    @font-face {
        font-family: "AkzidenzGrotesk";
        src: url('./AkzidenzGroteskRegular.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
    }

    body {
      margin: 0;
      padding: 0 24px 0 24px;
      display: flex;
      gap: 13px;
      height: 100vh;
      background: #fcfcfa;
      overflow-x: hidden;

      /* font-family: "helvetica-neue-lt-pro", sans-serif;
      font-weight: 500; */
      font-family: "AkzidenzGrotesk", sans-serif;
      font-size: 15px;

      -webkit-user-select:none;
      -moz-user-select:none;
      -ms-user-select:none;
      user-select:none;
    }

    b {
      /* //b is boring */
      font-weight: normal;
    }

    u {
      text-decoration: none;
    }

    .column {
      z-index: 1;
      flex: 1;
      display: flex;
      flex-direction: column;

      overflow-y: auto; /* 각 column에 스크롤 */
      scrollbar-width: none;
      position: relative;
    }

    .column::-webkit-scrollbar {
      display: none;
    }

    .item {
      position: auto;
      /* width: calc(100% - 20px); */
      width: 100%;
      box-sizing: border-box;
      /* overflow: hidden; */

      transform: opacity(0);
      transition: transform 1s ease;

      color: black;
      font-size: 1rem;
      line-height: 1.33;

    }

    .item img {
      width: 100%;
      height: auto; /* 비율 유지 */
      display: block;
    }

    .item p {
      margin: 0;
    }

    .control {
      margin-top: 2px;
      width: 100%;
      height: auto;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 2rem;
    } 

    .video-container {
      position: relative;
      width: 100%;
      margin: auto;
    }

    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      cursor: pointer;
    }

    .expandable {
      cursor: pointer;
      white-space: pre-wrap;
    }

    .extra {
      display: inline;
      pointer-events: none;
    }

    .extra a {
       pointer-events: auto;
       text-decoration-line: none;
       cursor: default;
       color: blue;
    }

    .extra a b {
       pointer-events: auto;
       text-decoration-line: underline;
       cursor: pointer;
       
    }

    .extra a:active{
      color: red;
    }

    .extra a i b{
      font-style: normal;
      pointer-events: none;
      text-decoration-line: none;
      color: black;
      cursor: default;
    }

    .extra a u b{
      font-style: normal;
      cursor: pointer;
      text-decoration-line: none;
    }

    .svg-bg-1 {
      position: absolute;
      left: -21px;
      top: calc(50% + 40px); 
      transform: translateY(-50%); 
      z-index: 0;
      pointer-events: none;
    }

    .svg-bg-2 {
      position: absolute;
      right: -21px;
      top: calc(50% + 40px);
      transform: translateY(-50%);
      z-index: 0;
      pointer-events: none;
    }

    #playPause {
      cursor: pointer;
    }

    .con-3 {
      width: 100%;
      text-align: right;
    }

    button {
      width: 1rem;
      height: 100%;

      background: inherit; 
      border:none; 
      box-shadow:none; 
      border-radius:0; 
      padding:0; 
      cursor:pointer;
      margin: auto;
    }

    /* button svg{
       vertical-align: middle;
    } */

  </style>
</head>
<body>
  <svg class="svg-bg-1" xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="40" height="250" viewBox="0 0 40 250">
    <defs>
      <style>
        .st0 {
          stroke: #000;
        }

        .st0, .st1 {
          stroke-width: .25px;
        }

        .st0, .st1, .st2 {
          fill: none;
        }

        .st1 {
          stroke: #000000;
        }

        .f05 {
          fill: #0c0c0c;
        }

        .f25 {
          fill: #3f3f3f;
        }

        .f50 {
          fill: #7f7f7f;
        }

        .f75 {
          fill: #bfbfbf;
        }

        .f95 {
          fill: #f2f2f2;
        }
        
        .f100 {
          fill: #ffffff;
        }

      </style>

    </defs>
    <g class="st9">
      <line class="st1" x1="20" y1="10" x2="20" y2="72"/>
      <line class="st1" x1="35" y1="40" x2="5" y2="40"/>
      <circle class="st1" cx="20" cy="40" r="6"/>
    </g>
    <rect x="10" y="100" width="20" height="20"/>
    <rect class="f05" x="10" y="120" width="20" height="20"/>
    <rect class="f25" x="10" y="140" width="20" height="20"/>
    <rect class="f50" x="10" y="160" width="20" height="20"/>
    <rect class="f75" x="10" y="180" width="20" height="20"/>
    <rect class="f95" x="10" y="200" width="20" height="20"/>
    <rect class="f100" x="10" y="220" width="20" height="20"/>
    <g class="st2">
      <rect class="st0" x="10" y="100" width="20" height="140"/>
    </g>
    <line class="st0" x1="10" y1="120" x2="30" y2="120"/>
    <line class="st0" x1="10" y1="140" x2="30" y2="140"/>
    <line class="st0" x1="10" y1="160" x2="30" y2="160"/>
    <line class="st0" x1="10" y1="180" x2="30" y2="180"/>
    <line class="st0" x1="10" y1="200" x2="30" y2="200"/>
    <line class="st0" x1="10" y1="220" x2="30" y2="220"/>
  </svg>
  <svg class="svg-bg-2" xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="40" height="250" viewBox="0 0 40 250">
    <defs>
      <style>
        .st0 {
          stroke: #000;
          stroke-width: .25px;
        }
      </style>
    </defs>
    <g class="st0">
      <line class="st1" x1="20" y1="10" x2="20" y2="72"/>
      <line class="st1" x1="35" y1="40" x2="5" y2="40"/>
      <circle class="st1" cx="20" cy="40" r="6"/>
    </g>
  </svg>

  <div class="column"></div>
  <div class="column"></div>
  <div class="column"></div>
  <div class="column"></div>
  <div class="column"></div>

  <script>
    const items = [
      { 
        video: "https://player.vimeo.com/progressive_redirect/playback/1079349393/rendition/1080p/file.mp4?loc=external&amp;signature=ed914a46a9b1c0e32d6316f3d2d75e3f121e795ce7af8de86114a3157d5574ec", 
        ratio: "16/9",
        name: "lee seokjun",
        insert: "<a href='https://www.instagram.com/__levenge__' target='_blank'><i>(</i><u>@</u><b>__levenge__</b></a>) is the visual director and photographer for K-pop group Balming Tiger. he leads music video, album art, and branding, shaping the group&#39;s unique visual identity with a blend of analog and digital photography",
        caption: ", untitled unt, single-channel video(color, sound), 24min 3s." 
      },{
        video: "https://player.vimeo.com/progressive_redirect/playback/1079349393/rendition/1080p/file.mp4?loc=external&amp;signature=ed914a46a9b1c0e32d6316f3d2d75e3f121e795ce7af8de86114a3157d5574ec", 
        ratio: "16/9",
        name: "lee sohyun",
        insert: "<a href='https://www.instagram.com/leesohynn' target='_blank'><i>(</i><u>@</u><b>leesohynn</b></a>) is the visual director and photographer for K-pop group Balming Tiger. he leads music video, album art, and branding, shaping the group&#39;s unique visual identity with a blend of analog and digital photography", 
        caption: ", untitled, single-channel video(b&w, sound), 7min 52s." 
      },{ 
        video: "https://player.vimeo.com/progressive_redirect/playback/1079349393/rendition/1080p/file.mp4?loc=external&amp;signature=ed914a46a9b1c0e32d6316f3d2d75e3f121e795ce7af8de86114a3157d5574ec", 
        ratio: "4/3",
        name: "kwon jeheon",
        insert: "<a href='https://vimeo.com/arnelehor' target='_blank'><i>(</i><u>@</u><b>arnelehor</b></a>) is the visual director and photographer for K-pop group Balming Tiger. he leads music video, album art, and branding, shaping the group&#39;s unique visual identity with a blend of analog and digital photography",
        caption: ", untitled 2, single-channel video(color, sound), 11min 13s." 
      },{ 
        video: "https://player.vimeo.com/progressive_redirect/playback/1079349393/rendition/1080p/file.mp4?loc=external&amp;signature=ed914a46a9b1c0e32d6316f3d2d75e3f121e795ce7af8de86114a3157d5574ec", 
        ratio: "16/9",
        name: "hwang hyunjin",
        insert: "<a href='https://www.instagram.com/hwanghimalaya' target='_blank'><i>(</i><u>@</u><b>hwanghimalaya</b></a>) is the visual director and photographer for K-pop group Balming Tiger. he leads music video, album art, and branding, shaping the group&#39;s unique visual identity with a blend of analog and digital photography",
        caption: ", untitled, single-channel video(color, silent), 13min 3s." 
      },{ 
        video: "https://player.vimeo.com/progressive_redirect/playback/1079349393/rendition/1080p/file.mp4?loc=external&amp;signature=ed914a46a9b1c0e32d6316f3d2d75e3f121e795ce7af8de86114a3157d5574ec", 
        ratio: "16/9",
        name: "lee suho",
        insert: "<a href='https://www.instagram.com/leesuho.asia' target='_blank'><i>(</i><u>@</u><b>leesuho.asia</b></a>) is the visual director and photographer for K-pop group Balming Tiger. he leads music video, album art, and branding, shaping the group&#39;s unique visual identity with a blend of analog and digital photography",
        caption: ", untitled, single-channel video(color, sound), 3min 27s." 
      },{
        video: "https://player.vimeo.com/progressive_redirect/playback/1079349393/rendition/1080p/file.mp4?loc=external&amp;signature=ed914a46a9b1c0e32d6316f3d2d75e3f121e795ce7af8de86114a3157d5574ec", 
        ratio: "16/9",
        name: "hong chanhee",
        insert: "<a href='https://www.instagram.com/seoulthesoloist' target='_blank'><i>(</i><u>@</u><b>seoulthesoloist</b></a>) is the visual director and photographer for K-pop group Balming Tiger. he leads music video, album art, and branding, shaping the group&#39;s unique visual identity with a blend of analog and digital photography",
        caption: ", untitled video, single-channel video(color, sound), 2 min 34s." 
      }
    ];

    const columns = document.querySelectorAll('.column');
    const colCount = columns.length;

    // 위치 기록
    const usedPositions = Array.from({ length: colCount }, () => new Set());

    // 1. 각 column에 최소 1개 배정
    const shuffledItems = [...items].sort(() => Math.random() - 0.5);
    shuffledItems.forEach((data, index) => {
      if (index < colCount) {
        placeItem(data, index);
      }
    });

    // 2. 남은 아이템 랜덤 column에 배정
    for (let i = colCount; i < shuffledItems.length; i++) {
      const randCol = Math.floor(Math.random() * colCount);
      placeItem(shuffledItems[i], randCol);
    }

    function placeItem(data, colIndex) {
      const col = columns[colIndex];
      const step = 90;
      const maxStep = 6;

      let pos;
      do {
        pos = Math.floor(Math.random() * maxStep) * step + 23;
      } while (usedPositions[colIndex].has(pos));
      usedPositions[colIndex].add(pos);

      const el = document.createElement('div');
      el.className = 'item';
      el.style.marginTop = pos + 'px';
      el.innerHTML = `
        <div class="video-container">
          <video class="video" @click="playpause()" style="aspect-ratio: ${data.ratio};" src="${data.video}" type="video/mp4" preload="metadata"></video>
          <div class="control">
            <p class="time">00:00</p>
            <p class="playPause">play</p>
            <p></p>
            <div class="con-3">
              <button class="fullscreen">
                <svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 12 12">
                  <defs><style> .st0 { fill: none; stroke: #000; stroke-width: 1.1px;} </style></defs>
                  <polyline class="st0" points="7 2 11 2 11 6"/>
                  <polyline class="st0" points="6 11 2 11 2 7"/>
                </svg>
              </button>
            </div>
          </div>
          <p><span class="expandable" data-insert="${data.insert}">${data.name}</span>${data.caption}</p>
        </div>
      `;
      col.appendChild(el);
    }
    document.querySelectorAll('.video-container').forEach(container => {
      const video = container.querySelector('.video');
      const playPause = container.querySelector('.playPause');
      const timeDisplay = container.querySelector('.time');
      const fullscreen = container.querySelector('.fullscreen');

      function formatTime(seconds) {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = Math.floor(seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      }

      function togglePlayPause() {
        if (video.paused) {
          video.play();
          playPause.textContent = 'pause';
        } else {
          video.pause();
          playPause.textContent = 'play';
        }
      }

      video.addEventListener('click', togglePlayPause);
      playPause.addEventListener('click', togglePlayPause);

      video.addEventListener('timeupdate', () => {
        timeDisplay.textContent = `${formatTime(video.currentTime)}`;
      });

      video.addEventListener('pause', () => {
        playPause.textContent = 'play';
      });

      video.addEventListener('play', () => {
        playPause.textContent = 'pause';
      });

      fullscreen.addEventListener('click', () => {
        // 현재 컨테이너 안의 video
        const currentVideo = video;

        // 다른 모든 video 멈춤
        document.querySelectorAll('video').forEach(v => {
          if (v !== currentVideo && !v.paused) {
            v.pause();
          }
        });

        if (currentVideo.paused) {
          currentVideo.play();
        }

        // fullscreen 전환
        if (!document.fullscreenElement) {
          container.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      });
    });

    //토글
    function buildAnimatedFragment(rawHTML, onCharReady) {
      const temp = document.createElement('div');
      temp.innerHTML = rawHTML;

      function walk(node, parent) {
        if (node.nodeType === Node.TEXT_NODE) {
          for (const ch of [...node.textContent]) {
            onCharReady(() => {
              const s = document.createElement('b');
              s.textContent = ch;
              parent.appendChild(s);
            });
          }
        } else if (node.nodeType === Node.ELEMENT_NODE) {
          const clone = node.cloneNode(false);
          parent.appendChild(clone);
          node.childNodes.forEach(child => walk(child, clone));
        }
      }

      const container = document.createElement('b');
      container.className = 'extra';
      temp.childNodes.forEach(n => walk(n, container));
      return container;
    }

    // 토글 핸들러
    document.addEventListener('click', e => {
      const word = e.target.closest('.expandable');
      if (!word) return;

      const existing = word.nextElementSibling;
      if (existing && existing.classList.contains('extra')) {
        existing.remove();
        return;
      }

      let i = 0;
      const tasks = [];
      const container = buildAnimatedFragment('' + word.dataset.insert, fn => tasks.push(fn));
      word.insertAdjacentElement('afterend', container);

      const step = 30; // ms
      function next() {
        if (i < tasks.length) {
          tasks[i++]();
          setTimeout(next, step);
        }
      }
      next();
    });
  </script>

</body>
</html>
